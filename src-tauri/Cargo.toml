[package]
name = "Buzz"
version = "0.0.0"
description = "Buzz application foundation"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[features]
native-mcp = ["dep:tauri-plugin-mcp-bridge"]

[lib]
name = "buzz_foundation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
url = "2"
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
buzz-nsec-backup = { path = "../crates/nsec-backup" }
buzz-pairing = { path = "../crates/pairing" }
nostr-pairing = { package = "nostr", version = "0.45", features = ["nip44"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

tauri = { version = "=2.12.4", features = ["unstable"] }
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
buzzodz-plugins = { path = "../crates/plugin-manager" }
buzz-credential-store = { path = "../crates/credential-store" }
buzz-agent-controller = { path = "../crates/agent-controller" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
buzz-audio-client = { git = "https://github.com/block/buzz.git", rev = "9e7534b79d624d2dd2e50a81940fd449c8502d49" }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util", "net"] }
sha2 = "0.10"
hmac = "0.13"
base64 = "0.23"
dunce = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
url = "2"
percent-encoding = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "~2.14.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.5.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
bech32 = "0.12"
secp256k1 = { version = "0.33", default-features = false, features = ["std"] }
getrandom = "0.4"
zeroize = "1.9"
nostr = { version = "=0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
dirs = "6"
rfd = { version = "0.17", default-features = false }
tempfile = "3"
fs2 = "0.4"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["test-util"] }
secp256k1 = { version = "0.33", features = ["std"] }
tauri = { version = "=2.12.4", features = ["test"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user"] }
portable-pty = "0.9"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Pin the small upstream Origin rejection fix; released versions accept browser clients.
tauri-plugin-mcp-bridge = { git = "https://github.com/hypothesi/mcp-server-tauri", rev = "1d5105e72835b28ca05a75bcd612b9127c12fe94", optional = true }
security-framework = "3.7"
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSScreen", "NSWindow", "NSEvent", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSThread", "NSBundle", "NSString", "NSError", "NSUserDefaults", "NSProcessInfo"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNUserNotificationCenter", "UNNotificationSettings", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "block2"] }

objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.100.0"
tauri-winrt-notification = "=0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Deep-link 2.6.2 requires rust-ini's two-field ParseOption from 0.21.1.
rust-ini = "=0.21.3"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
futures-lite = "=2.6.1"
gtk = "0.18"
webkit2gtk = "=2.0.2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
user-idle = { version = "0.6", default-features = false }
