[package]
name = "buzz-nsec-backup"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native HTTP client for Buzz nsec backups"

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
zeroize = "1.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
